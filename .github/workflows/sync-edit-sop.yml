
name: Sync edit-sop with main

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: >
      github.event_name == 'push' ||
      (
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.ref == 'edit-sop'
      )

    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync edit-sop with main
        run: |
          git push origin main:edit-sop
